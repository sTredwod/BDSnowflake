services:
  postgres:
    image: postgres:16
    container_name: bd_snowflake_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student123
      POSTGRES_DB: snowflake
    ports:
      - "5433:5432"
    volumes:
      - snowflake_pgdata:/var/lib/postgresql/data
      - "./исходные данные:/csv:ro"
      - "./init:/docker-entrypoint-initdb.d:ro"

volumes:
  snowflake_pgdata:
